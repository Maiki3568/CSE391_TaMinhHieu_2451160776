<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations Demo</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="page-wrapper">

        <h1 class="page-title">
            CSS Transitions And Animations
        </h1>

        <section class="demo-section">

            <h2>
                Card Hover Effect
            </h2>

            <div class="demo-row">

                <div class="product-card">

                    <div class="product-card__image-wrap">
                        <img
                            src="https://placehold.co/280x180/667eea/ffffff?text=Product"
                            alt="product"
                        >
                    </div>

                    <div class="product-card__body">
                        <h3>iPhone 15 Pro</h3>
                        <p class="price">29.990.000đ</p>
                        <button class="buy-btn">Mua ngay</button>
                    </div>

                </div>

                <div class="product-card">

                    <div class="product-card__image-wrap">
                        <img
                            src="https://placehold.co/280x180/764ba2/ffffff?text=Product"
                            alt="product"
                        >
                    </div>

                    <div class="product-card__body">
                        <h3>MacBook Air M3</h3>
                        <p class="price">28.990.000đ</p>
                        <button class="buy-btn">Mua ngay</button>
                    </div>

                </div>

                <div class="product-card">

                    <div class="product-card__image-wrap">
                        <img
                            src="https://placehold.co/280x180/38a169/ffffff?text=Product"
                            alt="product"
                        >
                    </div>

                    <div class="product-card__body">
                        <h3>iPad Pro M4</h3>
                        <p class="price">24.990.000đ</p>
                        <button class="buy-btn">Mua ngay</button>
                    </div>

                </div>

            </div>

        </section>

        <section class="demo-section">

            <h2>
                Loading Spinner
            </h2>

            <div class="spinner-wrap">
                <div class="spinner"></div>
                <p>Đang tải</p>
            </div>

        </section>

        <section class="demo-section">

            <h2>
                Fade In Animation
            </h2>

            <div class="fade-grid">

                <div class="fade-card">
                    Card 1
                </div>

                <div class="fade-card fade-card--delay1">
                    Card 2
                </div>

                <div class="fade-card fade-card--delay2">
                    Card 3
                </div>

                <div class="fade-card fade-card--delay3">
                    Card 4
                </div>

            </div>

        </section>

    </div>

</body>
</html>
